<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/css/output.css" rel="stylesheet">
    <title>Login Gatitos</title>
</head>

<body>
<header>
    <img src="./src/img/gatito.png" alt="gatito" width="100px">
    <img src="" alt=""> <!---una imagen para configuracion y otra para salir-->
</header>

<main>
    <h2>Registrarse</h2>
    <h3>correo electrónico</h3>
    <input type="email" name="email" required>
    <h3>contraseña</h3>
    <input type="password" name="password" required>
    <button type="button" onclick="togglePasswordVisibility()">Mostrar contraseña</button>
    <h3>confirmar contraseña</h3>
    <input type="password" name="password_confirmation" required>
    <button type="submit">Registro</button> 
</main>

</body>
</html>
