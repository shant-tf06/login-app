<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet">
    <script src="./server/server.js" defer></script>
    <title>Login Gatitos</title>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

<header>
    <h1 class="text-xl font-bold text-purple-600 text-left p-6">Los Gatitos S.A.</h1>
    <img src="./imagen/gatitos.png" alt="gatitos_logo" class="w-80 h-80 mt-4">  

  
</header>

<main class="grow">
  <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight text-center">¡Bienvenido!</h2>

<form action="" method="post" class="max-w-md mx-auto mt-8 p-6 bg-white rounded-lg shadow-md text-center">
    <section>
      <h1 class="mt-6 text-3xl font-extrabold text-gray-900 tracking-tight">Iniciar sesión</h1>
        <label for="username" class="block text-lg font-medium text-gray-700">Usuario:</label>
        <input type="text" id="username" name="username" autocomplete="username" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"/>
    
        <label for="password" class="block text-lg font-medium text-gray-700">Contraseña:</label>
        <input type="password" id="password" name="password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"/>
        <button type="button" onclick="togglePasswordVisibility()">Mostrar contraseña</button>
    </section>

    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Ingresar</button>
</form>
 
</main>

<footer>
    <p>¿No tienes cuenta? <a href="./register.html" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Registrate</a></p>
</footer>

</body>
</html>
